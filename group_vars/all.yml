---
# The playbook can target this machine or a remote host. Both values come from
# facts, so they follow the connection user instead of the controller's shell.
username: "{{ ansible_user_id }}"
home: "{{ ansible_env.HOME }}"

# Host architecture used to pick upstream release assets.
arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
topgrade_arch: "{{ 'aarch64' if ansible_architecture == 'aarch64' else 'x86_64' }}"

# Packages installed by the base and docker roles.
packages_apt:
  - copyq
  - curl
  - fwupd
  - git
  - net-tools
  - python3-pip
  - software-properties-common
  - unrar
  - unzip
  - wget
  - zip

packages_pip: []

packages_snap: []

docker_packages:
  - docker.io
  - docker-compose-v2

# CLI versions installed by the k8s_tools and topgrade roles. Bump these
# deliberately; the CI lint job checks the playbook, not upstream releases.
kops_version: "1.36.2"
kubectl_version: "1.37.2"
kubelogin_version: "1.36.4"
istioctl_version: "1.31.3"
helm_version: "4.3.1"
kustomize_version: "5.8.3"
topgrade_version: "17.14.1"
