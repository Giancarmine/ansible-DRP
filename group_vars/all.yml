---
# The playbook can target this machine or a remote host. Both values come from
# facts, so they follow the connection user instead of the controller's shell.
username: "{{ ansible_user_id }}"
home: "{{ ansible_env.HOME }}"

# Host architecture used to pick upstream release assets. The playbook asserts
# that the target is x86_64 or aarch64 before these are evaluated.
arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"
topgrade_arch: "{{ {'x86_64': 'x86_64', 'aarch64': 'aarch64'}[ansible_architecture] }}"

# Packages installed by the base and docker roles.
packages_apt:
  - copyq
  - curl
  - fwupd
  - git
  - net-tools
  - python3-pip
  - software-properties-common
  - unrar
  - unzip
  - wget
  - zip

packages_pip: []

packages_snap: []

docker_packages:
  - docker.io
  - docker-compose-v2

# CLI versions installed by the k8s_tools and topgrade roles. Bump these
# deliberately; the CI lint job checks the playbook, not upstream releases.
kops_version: "1.36.2"
kubectl_version: "1.37.2"
kubelogin_version: "1.36.4"
istioctl_version: "1.31.3"
helm_version: "4.3.1"
kustomize_version: "5.8.3"
topgrade_version: "17.14.1"

# SHA256 of every pinned release asset. `custom_tools` verifies the download
# against these hashes, so a version bump must update the version and both
# architecture hashes together. Topgrade uses its own asset naming, hence the
# x86_64/aarch64 keys.
release_checksums:
  kops:
    amd64: "0a497df3665569f07c76c31a245ab2cc69e1d327faf7805b83358fde5a4b8da1"
    arm64: "a76472e9b4ca549202fda98bd706d593be550c203eb5b02c9fbbfd8c20dc5419"
