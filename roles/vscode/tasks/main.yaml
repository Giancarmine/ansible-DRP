---
- name: Microsoft Visual Studio Code
  ansible.builtin.include_role:
    name: custom_apt
    apply:
      tags: [vscode]
    public: false
  vars:
    custom_apt_name: vscode
    custom_apt_key:
      url: https://packages.microsoft.com/keys/microsoft.asc
      keyring: /etc/apt/keyrings/vscode.asc
    custom_apt_repo: https://packages.microsoft.com/repos/code stable main
    custom_apt_package: code
  tags: [vscode]
