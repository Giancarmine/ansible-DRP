---
- name: Install zsh and git
  become: true
  ansible.builtin.apt:
    name:
      - zsh
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [zsh]

- name: Clone Oh My Zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ home }}/.oh-my-zsh"
    version: "{{ ohmyzsh_version }}"
  tags: [zsh]

- name: Clone zsh plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ home }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
    version: "{{ item.version }}"
  loop: "{{ ohmyzsh_plugins }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [zsh]

- name: Set zsh as the default shell
  become: true
  ansible.builtin.user:
    name: "{{ username }}"
    shell: /bin/zsh
  tags: [zsh]

- name: Configure .zshrc
  ansible.builtin.template:
    src: zshrc.j2
    dest: "{{ home }}/.zshrc"
    mode: "0644"
    backup: true
  tags: [zsh]
