---
- name: Install kOps
  ansible.builtin.include_role:
    name: custom_tools
    apply:
      tags: [kops]
    public: false
  vars:
    custom_tools_name: kops
    custom_tools_version: "{{ kops_version }}"
    custom_tools_src_url: "{{ k8s_tools_github_url }}/kubernetes/kops/releases/download/v%/kops-linux-{{ arch }}"
    custom_tools_completion: "source <(kops completion bash --no-descriptions)"
    custom_tools_unarchive: false
  tags: [kops]

- name: Install kubectl
  ansible.builtin.include_role:
    name: custom_tools
    apply:
      tags: [kubectl]
    public: false
  vars:
    custom_tools_name: kubectl
    custom_tools_version: "{{ kubectl_version }}"
    custom_tools_src_url: "https://dl.k8s.io/release/v%/bin/linux/{{ arch }}/kubectl"
    custom_tools_completion: "source <(kubectl completion bash)"
    custom_tools_unarchive: false
  tags: [kubectl]

- name: Install Helm
  ansible.builtin.include_role:
    name: custom_tools
    apply:
      tags: [helm]
    public: false
  vars:
    custom_tools_name: helm
    custom_tools_version: "{{ helm_version }}"
    custom_tools_src_url: "https://get.helm.sh/helm-v%-linux-{{ arch }}.tar.gz"
    custom_tools_target: "linux-{{ arch }}/helm"
    custom_tools_completion: "source <(helm completion bash --no-descriptions)"
    custom_tools_unarchive: true
  tags: [helm]

- name: Install istioctl
  ansible.builtin.include_role:
    name: custom_tools
    apply:
      tags: [istioctl]
    public: false
  vars:
    custom_tools_name: istioctl
    custom_tools_version: "{{ istioctl_version }}"
    custom_tools_src_url: "{{ k8s_tools_github_url }}/istio/istio/releases/download/%/istioctl-%-linux-{{ arch }}.tar.gz"
    custom_tools_target: istioctl
    custom_tools_unarchive: true
  tags: [istioctl]

- name: Install kubelogin
  ansible.builtin.include_role:
    name: custom_tools
    apply:
      tags: [kubelogin]
    public: false
  vars:
    custom_tools_name: kubelogin
    custom_tools_version: "{{ kubelogin_version }}"
    custom_tools_src_url: "{{ k8s_tools_github_url }}/int128/kubelogin/releases/download/v%/kubelogin_linux_{{ arch }}.zip"
    custom_tools_target: kubelogin
    custom_tools_unarchive: true
  tags: [kubelogin]

- name: Install kustomize
  ansible.builtin.include_role:
    name: custom_tools
    apply:
      tags: [kustomize]
    public: false
  vars:
    custom_tools_name: kustomize
    custom_tools_version: "{{ kustomize_version }}"
    custom_tools_src_url: "{{ k8s_tools_github_url }}/kubernetes-sigs/kustomize/releases/download/kustomize/v%/kustomize_v%_linux_{{ arch }}.tar.gz"
    custom_tools_target: kustomize
    custom_tools_unarchive: true
  tags: [kustomize]

- name: Install the kustomize wrapper
  become: true
  ansible.builtin.copy:
    src: usr/local/bin/kustomize-wrapper
    dest: /usr/local/bin/kustomize-wrapper
    mode: "0755"
  tags: [kustomize]
