---
custom_tools_lib_dir: /usr/local/lib
custom_tools_bin_dir: /usr/local/bin
custom_tools_unarchive: false
custom_tools_checksum: ""
custom_tools_completion_dir: "{{ home }}/.config/ansible-drp/completions.d"
# Release CDNs occasionally return 502/504 for a single request. Retry the
# download instead of failing the whole provision.
custom_tools_download_retries: 4
custom_tools_download_delay: 5
custom_tools_download_timeout: 60
