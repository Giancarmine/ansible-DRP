---
- name: "Create the installation directory for {{ custom_tools_name }}"
  become: true
  ansible.builtin.file:
    path: "{{ custom_tools_lib_dir }}/{{ custom_tools_name }}-{{ custom_tools_version }}"
    state: directory
    mode: "0755"

- name: "Download the binary for {{ custom_tools_name }}"
  become: true
  ansible.builtin.get_url:
    url: "{{ custom_tools_src_url | replace('%', custom_tools_version) }}"
    dest: "{{ custom_tools_lib_dir }}/{{ custom_tools_name }}-{{ custom_tools_version }}/{{ custom_tools_src_url | basename }}"
    mode: "0755"
  when: not (custom_tools_unarchive | bool)

- name: "Download and extract {{ custom_tools_name }}"
  become: true
  ansible.builtin.unarchive:
    src: "{{ custom_tools_src_url | replace('%', custom_tools_version) }}"
    dest: "{{ custom_tools_lib_dir }}/{{ custom_tools_name }}-{{ custom_tools_version }}/"
    remote_src: true
    creates: "{{ custom_tools_lib_dir }}/{{ custom_tools_name }}-{{ custom_tools_version }}/{{ custom_tools_target }}"
  when: custom_tools_unarchive | bool

- name: "Create the bin symlink for {{ custom_tools_name }}"
  become: true
  ansible.builtin.file:
    src: "{{ custom_tools_lib_dir }}/{{ custom_tools_name }}-{{ custom_tools_version }}/{{ custom_tools_target | default(custom_tools_src_url | basename) }}"
    path: "{{ custom_tools_bin_dir }}/{{ custom_tools_name }}"
    state: link

- name: "Add the shell completion for {{ custom_tools_name }}"
  ansible.builtin.lineinfile:
    path: "{{ home }}/.bashrc"
    line: "{{ custom_tools_completion }}"
    create: true
    mode: "0644"
  when: custom_tools_completion is defined
