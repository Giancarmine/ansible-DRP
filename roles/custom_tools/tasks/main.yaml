---
- name: "Check the checksum for {{ custom_tools_name }}"
  ansible.builtin.assert:
    that:
      - custom_tools_checksum is string
      - custom_tools_checksum is match('^[0-9a-f]{64}$')
    fail_msg: >-
      custom_tools_checksum must be a lowercase SHA256 for
      {{ custom_tools_name }}. Add the release hash to group_vars/all.yml.
    quiet: true

- name: "Create the installation directory for {{ custom_tools_name }}"
  become: true
  ansible.builtin.file:
    path: "{{ custom_tools_lib_dir }}/{{ custom_tools_name }}-{{ custom_tools_version }}"
    state: directory
    mode: "0755"

- name: "Download the binary for {{ custom_tools_name }}"
  become: true
  ansible.builtin.get_url:
    url: "{{ custom_tools_url }}"
    dest: "{{ custom_tools_lib_dir }}/{{ custom_tools_name }}-{{ custom_tools_version }}/{{ custom_tools_url | basename }}"
    checksum: "sha256:{{ custom_tools_checksum }}"
    mode: "0755"
    timeout: "{{ custom_tools_download_timeout }}"
  register: custom_tools_download
  until: custom_tools_download is succeeded
  retries: "{{ custom_tools_download_retries }}"
  delay: "{{ custom_tools_download_delay }}"
  when: not (custom_tools_unarchive | bool)
  vars:
    custom_tools_url: "{{ custom_tools_src_url | replace('%', custom_tools_version) }}"

- name: "Download the archive for {{ custom_tools_name }}"
  become: true
  ansible.builtin.get_url:
    url: "{{ custom_tools_url }}"
    dest: "{{ custom_tools_lib_dir }}/{{ custom_tools_name }}-{{ custom_tools_version }}/{{ custom_tools_url | basename }}"
    checksum: "sha256:{{ custom_tools_checksum }}"
    mode: "0644"
    timeout: "{{ custom_tools_download_timeout }}"
  register: custom_tools_download
  until: custom_tools_download is succeeded
  retries: "{{ custom_tools_download_retries }}"
  delay: "{{ custom_tools_download_delay }}"
  when: custom_tools_unarchive | bool
  vars:
    custom_tools_url: "{{ custom_tools_src_url | replace('%', custom_tools_version) }}"

- name: "Extract {{ custom_tools_name }}"
  become: true
  ansible.builtin.unarchive:
    src: "{{ custom_tools_lib_dir }}/{{ custom_tools_name }}-{{ custom_tools_version }}/{{ custom_tools_url | basename }}"
    dest: "{{ custom_tools_lib_dir }}/{{ custom_tools_name }}-{{ custom_tools_version }}/"
    remote_src: true
    creates: "{{ custom_tools_lib_dir }}/{{ custom_tools_name }}-{{ custom_tools_version }}/{{ custom_tools_target | default(custom_tools_url | basename) }}"
  when: custom_tools_unarchive | bool
  vars:
    custom_tools_url: "{{ custom_tools_src_url | replace('%', custom_tools_version) }}"

- name: "Create the bin symlink for {{ custom_tools_name }}"
  become: true
  ansible.builtin.file:
    src: "{{ custom_tools_lib_dir }}/{{ custom_tools_name }}-{{ custom_tools_version }}/{{ custom_tools_target | default((custom_tools_src_url | replace('%', custom_tools_version)) | basename) }}"
    path: "{{ custom_tools_bin_dir }}/{{ custom_tools_name }}"
    state: link

- name: "Find old installations of {{ custom_tools_name }}"
  become: true
  ansible.builtin.find:
    paths: "{{ custom_tools_lib_dir }}"
    patterns: "{{ custom_tools_name }}-*"
    file_type: directory
  register: custom_tools_installations

- name: "Remove old installations of {{ custom_tools_name }}"
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ custom_tools_installations.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) != (custom_tools_name ~ '-' ~ custom_tools_version)

- name: "Check the completion command for {{ custom_tools_name }}"
  ansible.builtin.assert:
    that:
      - custom_tools_completion_command is not string
      - custom_tools_completion_command | length > 0
    fail_msg: >-
      custom_tools_completion_command must be a non-empty argv list for
      {{ custom_tools_name }}.
    quiet: true
  when: custom_tools_completion_command is defined

- name: "Create the completion directory for {{ custom_tools_name }}"
  ansible.builtin.file:
    path: "{{ custom_tools_completion_dir }}"
    state: directory
    mode: "0755"
  when: custom_tools_completion_command is defined

# Generate the file once at provision time. Sourcing a process substitution in
# .zshrc would run every tool on every shell startup.
- name: "Generate the zsh completion for {{ custom_tools_name }}"
  ansible.builtin.command:
    argv: "{{ custom_tools_completion_command }}"
  register: custom_tools_completion_output
  changed_when: false
  when: custom_tools_completion_command is defined

- name: "Write the zsh completion for {{ custom_tools_name }}"
  ansible.builtin.copy:
    content: "{{ custom_tools_completion_output.stdout }}\n"
    dest: "{{ custom_tools_completion_dir }}/{{ custom_tools_name }}.zsh"
    mode: "0644"
  when: custom_tools_completion_command is defined
