---
- name: Install APT packages
  become: true
  ansible.builtin.apt:
    name: "{{ packages_apt }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [apt]

- name: Install PIP packages
  become: true
  ansible.builtin.pip:
    name: "{{ packages_pip }}"
    state: present
  when: packages_pip | length > 0
  tags: [pip]

- name: Install SNAP packages
  become: true
  community.general.snap:
    name: "{{ packages_snap }}"
    classic: true
  when: packages_snap | length > 0
  tags: [snap]
