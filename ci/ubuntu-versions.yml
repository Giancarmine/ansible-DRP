---
# Ubuntu releases exercised by the Vagrant end-to-end test.
#
# This file is the single source of truth: the Vagrantfile picks the box and
# version from here, and the Vagrant workflow builds its job matrix from the
# enabled entries. Add a release by validating its box locally and appending an
# entry, or keep an entry with `enabled: false` until the box is ready.
versions:
