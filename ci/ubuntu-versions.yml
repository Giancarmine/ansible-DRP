    box: alvistack/ubuntu-24.04
    box_version: "20260108.1.1"
    enabled: true

  - release: "22.04"
    box: alvistack/ubuntu-22.04
    box_version: "20260108.1.1"
    enabled: true

  - release: "26.04"
    box: alvistack/ubuntu-26.04
    box_version: "20260516.1.1"
    enabled: true
