---
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ansible-galaxy collection install --requirements-file requirements.yml

      - name: Lint YAML
        run: yamllint .

      - name: Lint Ansible
        run: ansible-lint

      - name: Check playbook syntax
        run: ansible-playbook --syntax-check ubuntu.yml

      - name: Check the Vagrantfile syntax
        run: ruby -c Vagrantfile

      - name: Check the Vagrant Ansible wrapper
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          cat >"$tmp/ansible-playbook" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$@"
          EOF
          chmod +x "$tmp/ansible-playbook"

          output=$(PATH="$tmp:$PATH" ci/ansible-playbook-compat \
            --inventory-file=/tmp/inventory --limit=ubuntu playbook.yml)
          printf '%s\n' "$output"
          grep -Fxq -- '--inventory=/tmp/inventory' <<<"$output"
          grep -Fxq -- '--limit=ubuntu' <<<"$output"
          grep -Fxq -- 'playbook.yml' <<<"$output"

          output=$(PATH="$tmp:$PATH" ci/ansible-playbook-compat \
            --inventory-file /tmp/inventory playbook.yml)
          printf '%s\n' "$output"
          grep -Fxq -- '--inventory' <<<"$output"
          grep -Fxq -- '/tmp/inventory' <<<"$output"

      - name: Verify the pinned release checksums
        run: python ci/verify-checksums.py

      - name: Install actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint

      - name: Lint GitHub Actions
        run: /tmp/actionlint

      - name: Install shellcheck
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  /tmp/shellcheck.tar.xz" \
            | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp

      - name: Lint shell scripts
        run: |
          /tmp/shellcheck-v0.10.0/shellcheck \
            bootstrap.sh ci/ansible-playbook-compat ci/verify-vm.sh \
            roles/k8s_tools/files/usr/local/bin/kustomize-wrapper

  bootstrap:
    name: Bootstrap on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run bootstrap and check the playbook
        run: |
          ./bootstrap.sh
          source .venv/bin/activate
          ansible --version
          ansible-playbook --syntax-check ubuntu.yml
