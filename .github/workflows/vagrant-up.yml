---
name: Vagrant

on:
  workflow_dispatch:
    inputs:
      verify-idempotence:
        description: Run a second provision and require changed=0
        type: boolean
        default: true
      ubuntu-version:
        description: Ubuntu release to test, or "all" for every enabled release in ci/ubuntu-versions.yml
        type: string
        default: all
  schedule:
    # Weekly run: pinned release URLs can disappear, and upstream packages move.
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: vagrant-${{ github.ref }}
  cancel-in-progress: true

env:
  VAGRANT_DEFAULT_PROVIDER: libvirt
  VAGRANT_NO_COLOR: "1"

jobs:
  versions:
    name: Collect the Ubuntu versions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate and build the matrix from ci/ubuntu-versions.yml
        id: matrix
        env:
          UBUNTU_VERSION: ${{ inputs.ubuntu-version || 'all' }}
        run: |
          value=$(ruby ci/verify-ubuntu-versions.rb --matrix --release "$UBUNTU_VERSION")
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          echo "Matrix: ${value}"

  vagrant:
    name: Ubuntu ${{ matrix.release }}
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      UBUNTU_VERSION: ${{ matrix.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Ansible on the host
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune -af || true
          df -h /

      - name: Check KVM availability
        run: |
          sudo modprobe kvm_intel 2>/dev/null || sudo modprobe kvm_amd 2>/dev/null || true
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not available. The runner cannot boot a KVM guest."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          grep -m1 -oE 'vmx|svm' /proc/cpuinfo || true

      - name: Set up Vagrant and libvirt
        # actionlint 1.7.12 rejects the $/ self-repository syntax that zizmor
        # recommends, so keep the workspace-relative form until actionlint
        # supports it.
        uses: ./.github/actions/vagrant-setup # zizmor: ignore[self-repository]

      - name: Cache Vagrant boxes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ runner.os }}-vagrant-${{ matrix.release }}-${{ matrix.box_version }}-${{ hashFiles('ci/ubuntu-versions.yml') }}
          restore-keys: |
            ${{ runner.os }}-vagrant-${{ matrix.release }}-
            ${{ runner.os }}-vagrant-

      - name: Show versions
        run: |
          ansible --version
          vagrant --version
          virsh --version

      - name: Validate the Vagrantfile
        run: vagrant validate

      - name: Provision the VM
        run: |
          set -o pipefail
          vagrant up --provider=libvirt 2>&1 | tee "/tmp/vagrant-${UBUNTU_VERSION}-up.log"

      - name: Verify the installed tools
        run: |
          set -o pipefail
          vagrant ssh -c 'bash /vagrant/ci/verify-vm.sh' \
            2>&1 | tee "/tmp/vagrant-${UBUNTU_VERSION}-verify.log"

      - name: Re-provision and check idempotence
        if: inputs.verify-idempotence || github.event_name == 'schedule'
        run: |
          set -o pipefail
          vagrant provision 2>&1 | tee "/tmp/vagrant-${UBUNTU_VERSION}-provision.log"
          ci/assert-recap.sh "/tmp/vagrant-${UBUNTU_VERSION}-provision.log" 0

      - name: Collect diagnostics
        if: failure()
        run: |
          {
            echo "== ubuntu =="
            echo "${UBUNTU_VERSION}"
            echo "== domains =="
            virsh -c qemu:///system list --all || true
            echo "== networks =="
            virsh -c qemu:///system net-list --all || true
            echo "== libvirtd =="
            sudo journalctl -u libvirtd --no-pager | tail -n 200 || true
            echo "== qemu logs =="
            sudo tail -n 100 /var/log/libvirt/qemu/*.log 2>/dev/null || true
            echo "== processes =="
            pgrep -af 'dnsmasq|qemu-system' || true
          } > "/tmp/vagrant-${UBUNTU_VERSION}-diagnostics.log" 2>&1
          cat "/tmp/vagrant-${UBUNTU_VERSION}-diagnostics.log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vagrant-logs-ubuntu-${{ matrix.release }}
          path: /tmp/vagrant-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Destroy the VM
        if: always()
        run: vagrant destroy -f || true
